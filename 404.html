<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Carlos Ebrahim Vendrell</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090e; --text: #ececea; --dim: #a8a9af; --mute: #6b6d75;
      --accent: #e8dcc4; --c-travel: #6a8db5; --line: rgba(255,255,255,0.08);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem; overflow: hidden; position: relative;
      -webkit-font-smoothing: antialiased;
    }
    /* Ambient orbs — same language as the rest of the site */
    .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.06; }
    .orb-1 { width: 600px; height: 600px; background: var(--c-travel); top: -20%; left: -10%; }
    .orb-2 { width: 500px; height: 500px; background: var(--accent); bottom: 5%; right: -10%; }
    .wrap { position: relative; z-index: 1; max-width: 540px; }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--c-travel); margin-bottom: 1.25rem;
    }
    h1 {
      font-size: clamp(4rem, 14vw, 8rem); font-weight: 800;
      letter-spacing: -0.05em; line-height: 0.95; margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent), var(--c-travel));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h2 {
      font-size: clamp(1.3rem, 3vw, 1.8rem); font-weight: 700;
      letter-spacing: -0.02em; margin-bottom: 1rem; color: var(--text);
    }
    p { color: var(--dim); font-size: 1rem; line-height: 1.7; margin-bottom: 2.25rem; }
    .home-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.9rem 1.6rem; border-radius: 999px;
      background: var(--accent); color: #111; font-weight: 600; font-size: 0.92rem;
      text-decoration: none; transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .home-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px -10px rgba(232,220,196,0.5); }
    .links {
      margin-top: 2.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
    }
    .links a { color: var(--mute); text-decoration: none; transition: color 0.2s; }
    .links a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="wrap">
    <div class="eyebrow">Error 404</div>
    <h1>404</h1>
    <h2>This page wandered off the map.</h2>
    <p>The link may be broken, or the page may have moved. Let's get you back on track.</p>
    <a href="/" class="home-btn">← Back home</a>
    <nav class="links">
      <a href="/pages/travel/travel-map.html">Travel</a>
      <a href="/pages/photography/gallery.html">Photography</a>
      <a href="/pages/tech/xr-videos.html">Tech</a>
      <a href="/pages/about/contact.html">Contact</a>
    </nav>
  </div>
</body>
</html>
